services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev -- -H 0.0.0.0
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    stdin_open: true
    tty: true

volumes:
  node_modules:
  next_cache:
